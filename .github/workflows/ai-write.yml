name: ai-write

on:
  push:
    paths:
      - "content/**"
      - "scripts/ai-write.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write:
    if: "!contains(github.event.head_commit.message, '[skip-ai]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install --no-save js-yaml

      - name: Generate
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          AI_MAX: "3"
        run: node scripts/ai-write.mjs

      - name: Commit
        run: |
          git config user.name "ai-writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if ! git diff --staged --quiet; then
            git commit -m "ai: 自动补全稿件 [skip-ai]"
            git push
          fi
